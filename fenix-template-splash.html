  :root { --fenix-azul:#041273; --fenix-thauane:#040798; --fenix-dell:#0076CE; --fenix-amarelo:#ffcb00; --fenix-branco:#ffffff;
          --fenix-degrade: linear-gradient(135deg, #040798, #0076CE); }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--fenix-azul); }
  #fenix-splash { position: fixed; inset: 0; z-index: 9999; background: var(--fenix-degrade); color: var(--fenix-branco);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9rem; text-align: center; overflow: hidden;
    padding: env(safe-area-inset-top, 0px) 1.5rem env(safe-area-inset-bottom, 0px); transition: opacity .25s ease; }
  #fenix-splash.saindo { opacity: 0; pointer-events: none; }
  /* Holofotes duplos: dois feixes que nascem na base da tela e sobem, se abrindo e balançando em sentidos opostos */
  .fenix-holofote { position: absolute; bottom: -4vh; width: 46vmax; height: 120vh; pointer-events: none; transform-origin: 50% 100%;
    background: linear-gradient(to top, rgba(255,255,255,.55) 0%, rgba(255,247,220,.26) 22%, rgba(255,203,0,.07) 52%, rgba(255,255,255,0) 82%);
    clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0); will-change: transform, opacity; }
  .fenix-holofote.e { left: 4%;  margin-left: -23vmax; animation: fenix-holo-e 4.6s ease-in-out infinite; }
  .fenix-holofote.d { right: 4%; margin-right: -23vmax; animation: fenix-holo-d 4.6s ease-in-out infinite; }
  .fenix-holofote-base { position: absolute; bottom: -10px; width: 90px; height: 26px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(ellipse, rgba(255,255,255,.95) 0%, rgba(255,247,220,.45) 45%, rgba(255,255,255,0) 72%); }
  .fenix-holofote-base.e { left: 4%; margin-left: -45px; } .fenix-holofote-base.d { right: 4%; margin-right: -45px; }
  @keyframes fenix-holo-e { 0% { transform: rotate(8deg);  opacity: 0; } 18% { opacity: 1; } 50% { transform: rotate(30deg); opacity: .9; } 100% { transform: rotate(8deg);  opacity: .85; } }
  @keyframes fenix-holo-d { 0% { transform: rotate(-8deg); opacity: 0; } 18% { opacity: 1; } 50% { transform: rotate(-30deg); opacity: .9; } 100% { transform: rotate(-8deg); opacity: .85; } }
  .fenix-splash-conteudo { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: .9rem; }
  .fenix-splash-icone { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(2,7,51,.45); }
  .fenix-splash-nome { font-size: 1.35rem; font-weight: 700; }
  .fenix-splash-empresa { font-size: .85rem; opacity: .9; }
  .fenix-splash-barra { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.28); overflow: hidden; margin-top: .4rem; }
  .fenix-splash-barra i { display: block; width: 40%; height: 100%; border-radius: 4px; background: var(--fenix-amarelo); animation: fenix-vaivem 1.1s ease-in-out infinite alternate; }
  @keyframes fenix-vaivem { from { transform: translateX(-10%); } to { transform: translateX(150%); } }
  html.fenix-sem-movimento .fenix-holofote.e { animation: none; opacity: .7; transform: rotate(14deg); }
  html.fenix-sem-movimento .fenix-holofote.d { animation: none; opacity: .7; transform: rotate(-14deg); }
  html.fenix-sem-movimento .fenix-splash-barra i { animation: none; width: 100%; }
  @media (prefers-reduced-motion: reduce) {
    .fenix-holofote.e { animation: none; opacity: .7; transform: rotate(14deg); }
    .fenix-holofote.d { animation: none; opacity: .7; transform: rotate(-14deg); }
    .fenix-splash-barra i { animation: none; width: 100%; }
  }
</style>
</head>

<script>
/* Fecha o splash assim que a tela certa estiver pronta (login ou app), sem atraso artificial,
   com teto de segurança de 1,2 s (regra 32). No app: chame fenixSplashFechar() quando a tela estiver pronta. */
function fenixSplashFechar() {
  var s = document.getElementById('fenix-splash');
  if (!s || s.classList.contains('saindo')) return;
  s.classList.add('saindo');
  setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 300);
}
setTimeout(fenixSplashFechar, 1200);
/* Toque de abertura (regra 59): no splash só toca se o navegador já permitir som; senão fica em silêncio
   e o toque sai no login que deu certo. FenixCore.som.tocarAbertura({ somentePermitido: true }); */
</script>
